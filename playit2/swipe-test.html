<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLAYIT 2 — lapozás teszt</title><link rel="stylesheet" href="./cinema-plus.css?v=5"><link rel="stylesheet" href="./swipe-fix.css?v=4"><style>html,body{margin:0;background:#080809;color:#f4dfbd;font-family:system-ui}main{max-width:760px;margin:auto;padding:28px 15px}h1{font:700 24px Georgia}p{color:#c6b79e;font-size:14px}#playit-catalog{padding:5px}.cine-rail-scroll>.cine-mini-wrap{flex:0 0 180px!important;width:180px!important}.cine-mini{height:255px!important;display:grid!important;place-items:center!important;text-align:center!important;font:700 19px Georgia!important;background:linear-gradient(145deg,#302116,#0b0b0e)!important}#out{padding:13px;border:1px solid #806442;border-radius:9px}</style></head><body><main id="playit-catalog"><h1>PLAYIT · Lapozás teszt</h1><p>Húzd oldalra a kártyákat, vagy nyomd meg a nyilakat. A felső sorban mindig másik filmnek kell előre kerülnie.</p><section class="cine-rail" aria-label="Teszt filmsor"><h3>Filmek</h3><div class="cine-rail-pager"><button type="button" data-cine-page="-1">‹</button><button type="button" data-cine-page="1">›</button></div><div class="cine-rail-scroll"><article class="cine-mini-wrap"><div class="cine-mini">01 · Film A</div></article><article class="cine-mini-wrap"><div class="cine-mini">02 · Film B</div></article><article class="cine-mini-wrap"><div class="cine-mini">03 · Film C</div></article><article class="cine-mini-wrap"><div class="cine-mini">04 · Film D</div></article><article class="cine-mini-wrap"><div class="cine-mini">05 · Film E</div></article></div></section><p id="out" role="status">Első film: Film A</p></main><script src="./swipe-fix.js?v=6"></script><script>window.PLAYIT_RAIL_OFFSETS=new Map();document.addEventListener('click',e=>{const b=e.target.closest('[data-cine-page]');if(b)window.PLAYIT_RAILS.step(document.querySelector('.cine-rail-scroll'),Number(b.dataset.cinePage));});new MutationObserver(()=>{const first=document.querySelector('.cine-mini');document.querySelector('#out').textContent='Első film: '+first.textContent;}).observe(document.querySelector('.cine-rail-scroll'),{childList:true});</script></body></html>
