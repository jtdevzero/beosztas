<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d1820">
  <title>Ma Este — mobilos koncepció</title>
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{font-family:system-ui,-apple-system,Arial,sans-serif;background:#09141c;color:#f5eee3}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:2px solid #ffd39a;outline-offset:2px}
    .app{height:100dvh;max-width:550px;margin:auto;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(90deg,#260b11 0,#101e28 11px,#0d1820 22px,#0d1820 calc(100% - 22px),#101e28 calc(100% - 11px),#260b11);position:relative}
    .top{flex:none;padding:calc(env(safe-area-inset-top) + 8px) 15px 5px;position:relative;z-index:2}
    .brandrow{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:33px}.brand{font-size:29px;line-height:1;letter-spacing:-2.3px;font-weight:1000;color:#eed4ac}.brand i{font-style:normal;color:#dcab65}.sub{font-size:8px;color:#c19f77;letter-spacing:1.9px;font-weight:700;margin-top:3px}.tools{display:flex;gap:9px}.iconbtn{width:33px;height:33px;border:1px solid #92714b55;border-radius:10px;background:#172a34;color:#eacb9f;font-size:17px}
    .toggles{display:grid;grid-template-columns:1fr 1fr auto;gap:7px;margin-top:10px}.toggle{display:flex;background:#192b35;border:1px solid #74583d66;border-radius:10px;padding:3px;height:33px;align-items:center}.toggle button{flex:1;border:0;color:#b6b7b8;background:transparent;border-radius:7px;font-size:10px;font-weight:750;height:25px;white-space:nowrap}.toggle button.active{background:#c49a61;color:#17202b}.counter{font-size:10px;color:#d8c29f;align-self:center;padding:0 2px;white-space:nowrap}
    .providers{display:flex;gap:6px;align-items:center;overflow:hidden;white-space:nowrap;margin-top:8px;height:34px}.pill{border:1px solid #94744a67;border-radius:8px;background:#192c35;color:#dccdb4;font-size:9px;font-weight:600;padding:4px 8px;min-width:42px;height:31px;display:grid;place-items:center}.pill.active{background:#c49a61;color:#111f29}.pill svg{display:block;height:19px;width:auto;max-width:57px}.pill .wordmark{display:block;font-weight:900;letter-spacing:-.5px;line-height:1}.pill .netflix{font:bold 24px/1 Georgia,serif;color:#e50914}.pill .max{font-size:18px;color:#f3ecff}.pill .prime{font-size:12px;color:#dceaff;position:relative;padding-bottom:3px}.pill .prime:after{content:'';position:absolute;bottom:0;left:5px;right:4px;height:4px;border-bottom:2px solid #24a4ef;border-radius:0 0 70% 70%}.pill .disney{font:italic 13px/1 Georgia,serif;color:#fff;position:relative;margin-top:5px}.pill .disney:before{content:'';position:absolute;left:-4px;right:-4px;top:-6px;height:9px;border-top:1.5px solid #adccff;border-radius:60% 60% 0 0;transform:rotate(-8deg)}
    .cinema{flex:1;min-height:0;margin:7px 12px 0;position:relative;padding:5px;border:1px solid #d2a569;background:linear-gradient(135deg,#4b2a15,#ebc58b 11%,#936334 35%,#e6bb76 75%,#6b411f);box-shadow:0 0 0 3px #2b1f18,0 9px 35px #000a;touch-action:none;overflow:hidden}
    .poster{position:relative;width:100%;height:100%;overflow:hidden;background:#20232a;isolation:isolate;will-change:transform,opacity}.poster:before{content:"";position:absolute;inset:0;background:var(--art);background-size:cover;filter:saturate(.93)}.poster:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#02050b66,transparent 30%,#080e16aa 58%,#061018 94%);pointer-events:none}.poster-art{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;z-index:1;pointer-events:none;filter:saturate(.93)}
    .topline{position:absolute;top:12px;left:12px;right:12px;z-index:3;display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:9px;letter-spacing:1.4px;color:#f2dec1;font-weight:750;text-shadow:0 1px 5px #000}.infobtn{border:1px solid #ffffff9a;background:#07101777;color:#fff;border-radius:50%;height:28px;width:28px;font-family:Georgia,serif;font-style:italic}
    .copy{position:absolute;z-index:3;bottom:0;left:0;right:0;padding:20px 19px 18px;text-shadow:0 2px 9px #000}.meta{color:#efc998;font-size:10px;letter-spacing:1.2px;font-weight:750}.copy h1{font-size:clamp(27px,7.5vw,39px);line-height:1.03;letter-spacing:-1.2px;margin:8px 0}.copy p{font-size:12px;line-height:1.48;margin:0 0 9px;color:#ece6dc;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.details{border:0;background:transparent;padding:2px 0;color:#f4d8ae;font-size:11px;font-weight:750}
    .dock{flex:none;display:flex;gap:8px;padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:#101d28;border-top:1px solid #ba955e80;z-index:4}.dock button{flex:1;min-width:0;border:1px solid #ffffff30;border-radius:10px;color:#fff;min-height:51px;display:flex;align-items:center;justify-content:center;gap:6px;flex-direction:column;font-size:10px;font-weight:750}.dock b{font-size:19px;line-height:1}.no{background:#55342b}.seen{background:#2f4a5f}.yes{background:#46684d}
    .hint{position:absolute;z-index:8;top:48%;left:50%;transform:translate(-50%,-50%);background:#0b182be8;border:1px solid #d6b079;color:#fff;padding:13px 17px;border-radius:13px;white-space:nowrap;font-weight:800;font-size:13px;opacity:0;transition:opacity .15s;pointer-events:none}.hint.show{opacity:1}
    .modal{position:absolute;z-index:10;inset:0;background:#091620eF;display:none;padding:40px 23px;overflow:auto}.modal.open{display:block}.modal h2{font-family:Georgia,serif;color:#e7bf85}.modal p{line-height:1.65;color:#d1d5d8}.modal button{background:#c49a61;color:#18222a;border:0;border-radius:10px;padding:12px 20px;font-weight:800}
    @media(max-height:700px){.top{padding-top:calc(env(safe-area-inset-top) + 4px)}.brand{font-size:24px}.providers{margin-top:4px}.cinema{margin-top:4px}.copy h1{font-size:26px}.copy p{font-size:11px}.dock button{min-height:45px}.dock{padding-top:6px}}
  </style>
</head>
<body><main class="app">
  <header class="top"><div class="brandrow"><div><div class="brand">PLAY<i>IT</i></div><div class="sub">A MA ESTI FILMKLUB</div></div><nav class="tools"><button class="iconbtn" aria-label="Keresés" onclick="showModal('Keresés')">⌕</button><button class="iconbtn" aria-label="Már látottak" onclick="showModal('Már látott filmek')">◉</button><button class="iconbtn" aria-label="Szűrők" onclick="showModal('Szűrők')">☷</button></nav></div>
    <div class="toggles"><div class="toggle" data-group="players"><button class="active">Egyedül</button><button>Párosan</button></div><div class="toggle" data-group="media"><button class="active">Film</button><button>Sorozat</button></div><div class="counter" id="count">01 / 04</div></div>
    <div class="providers" role="group" aria-label="Streaming szolgáltatók"><button class="pill active" aria-label="Összes szolgáltató" title="Mind">✦</button><button class="pill" aria-label="Netflix" title="Netflix"><span aria-hidden="true" class="wordmark netflix">N</span></button><button class="pill" aria-label="Max" title="Max"><span aria-hidden="true" class="wordmark max">max</span></button><button class="pill" aria-label="Disney+" title="Disney+"><span aria-hidden="true" class="wordmark disney">Disney+</span></button><button class="pill" aria-label="Prime Video" title="Prime Video"><span aria-hidden="true" class="wordmark prime">prime</span></button></div>
  </header>
  <section class="cinema" id="cinema" aria-label="Filmkártya, húzd balra, jobbra vagy lefelé"><article class="poster" id="poster"><svg class="poster-art" viewBox="0 0 360 640" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Eredeti sci-fi filmplakát illusztráció"><defs><radialGradient id="sky" cx="50%" cy="34%" r="65%"><stop stop-color="#ceac82"/><stop offset=".35" stop-color="#56657a"/><stop offset=".8" stop-color="#122d40"/><stop offset="1" stop-color="#07131c"/></radialGradient><linearGradient id="ground" x2="0" y2="1"><stop stop-color="#243844"/><stop offset="1" stop-color="#061018"/></linearGradient><radialGradient id="halo"><stop stop-color="#f8d7aa" stop-opacity=".6"/><stop offset="1" stop-color="#f8d7aa" stop-opacity="0"/></radialGradient></defs><rect width="360" height="640" fill="url(#sky)"/><ellipse cx="180" cy="205" rx="165" ry="166" fill="url(#halo)"/><circle cx="180" cy="207" r="85" fill="none" stroke="#f6d6a3" stroke-opacity=".62" stroke-width="2"/><circle cx="180" cy="207" r="94" fill="none" stroke="#f6d6a3" stroke-opacity=".16"/><g fill="#f4e0bb" opacity=".85"><circle cx="41" cy="66" r="1"/><circle cx="309" cy="98" r="1.4"/><circle cx="72" cy="185" r="1"/><circle cx="276" cy="256" r="1.3"/><circle cx="321" cy="321" r="1"/></g><path d="M0 386L43 347 73 366 129 330 180 362 236 318 302 365 360 337V640H0Z" fill="#1c3341" opacity=".8"/><path d="M0 422L60 379 107 411 183 369 252 407 315 375 360 391V640H0Z" fill="url(#ground)"/><g fill="#0c1e29"><rect x="11" y="403" width="39" height="94"/><rect x="52" y="383" width="28" height="120"/><rect x="84" y="420" width="48" height="88"/><rect x="262" y="391" width="39" height="122"/><rect x="310" y="418" width="39" height="98"/></g><g fill="#e5ae6a" opacity=".45"><rect x="60" y="400" width="3" height="5"/><rect x="67" y="415" width="3" height="5"/><rect x="271" y="423" width="3" height="5"/><rect x="326" y="438" width="3" height="5"/></g><g fill="#06121c"><path d="M139 500Q142 434 157 418L171 407 190 407 203 418Q219 438 223 500L244 640H114Z"/><ellipse cx="180" cy="393" rx="25" ry="31"/><path d="M155 393Q153 359 180 360Q209 362 205 393Q186 379 155 393Z"/></g></svg><div class="topline"><span class="eyebrow">✦ MA ESTE A MŰSORON</span><button class="infobtn" aria-label="Részletek" onclick="showModal('Film részletei')">i</button></div><div class="copy"><div class="meta" id="meta"></div><h1 id="title"></h1><p id="desc"></p><button class="details" onclick="showModal('Film részletei')">A történet és az előzetes</button></div></article></section>
  <nav class="dock" aria-label="Filmválasztás"><button class="no" onclick="choose('no')"><b>✕</b>Kihagyom</button><button class="seen" onclick="choose('seen')"><b>◉</b>Már láttam</button><button class="yes" onclick="choose('yes')"><b>♡</b>Jöhet!</button></nav>
  <div class="hint" id="hint" role="status"></div><aside class="modal" id="modal"><button style="float:right" onclick="document.getElementById('modal').classList.remove('open')">Bezárás ✕</button><h2 id="modal-title"></h2><p>Ez csak egy interaktív felületminta. A valódi alkalmazás tartalma és funkciói változatlanok.</p></aside>
</main><script>
const movies=[
 {title:'ÉJFÉLI HORIZONT',meta:'★ 8.7 · SCI-FI · 2026',desc:'Egy titokzatos jel újraírja mindazt, amit a világról tudtunk.',art:'radial-gradient(circle at 52% 29%,#b99a78 0,#615475 19%,#173342 45%,#070e1a 87%)'},
 {title:'AZ UTOLSÓ FÉNY',meta:'★ 8.4 · DRÁMA · 2025',desc:'Egyetlen este alatt két élet sorsa fonódik össze.',art:'radial-gradient(circle at 53% 27%,#e5bc78 0,#a56854 21%,#463148 46%,#0a1020 86%)'},
 {title:'MÉLYVÍZ',meta:'★ 8.2 · THRILLER · 2026',desc:'A tenger mélyén olyan igazság vár, amelynek nem kellett volna felszínre kerülnie.',art:'radial-gradient(circle at 50% 25%,#a2dcce 0,#287e92 20%,#103c5c 51%,#081524 87%)'},
 {title:'AZ ARANY VÁROS',meta:'★ 8.9 · KALAND · 2024',desc:'Régi térképek, elveszett ígéretek és egy különös felfedezés.',art:'radial-gradient(circle at 52% 27%,#f6d38e 0,#ab6e36 22%,#51412c 54%,#101a20 86%)'}
];let index=0,busy=false;const poster=document.getElementById('poster');function draw(){const m=movies[index%movies.length];poster.style.setProperty('--art',m.art);document.getElementById('title').textContent=m.title;document.getElementById('meta').textContent=m.meta;document.getElementById('desc').textContent=m.desc;document.getElementById('count').textContent=String(index%movies.length+1).padStart(2,'0')+' / 04'}function choose(type){if(busy)return;busy=true;const dir=type==='no'?-32:type==='yes'?32:0;poster.animate([{transform:'translate3d(0,0,0)',opacity:1},{transform:`translate3d(${dir}px,${type==='seen'?30:-8}px,0) scale(.97)`,opacity:0}],{duration:210,easing:'ease-in',fill:'forwards'}).finished.then(()=>{index++;draw();poster.animate([{opacity:.75,transform:'scale(.99)'},{opacity:1,transform:'scale(1)'}],{duration:160,easing:'ease-out'});busy=false}).catch(()=>{busy=false})}let sx=0,sy=0;poster.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;sx=e.clientX;sy=e.clientY;poster.setPointerCapture(e.pointerId)});poster.addEventListener('pointerup',e=>{if(e.target.closest('button'))return;const dx=e.clientX-sx,dy=e.clientY-sy;if(dy>50&&Math.abs(dy)>Math.abs(dx))choose('seen');else if(dx>55)choose('yes');else if(dx< -55)choose('no')});document.querySelectorAll('.toggle').forEach(group=>group.addEventListener('click',e=>{if(e.target.tagName!=='BUTTON')return;group.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===e.target))}));document.querySelectorAll('.pill').forEach(p=>p.addEventListener('click',()=>{document.querySelectorAll('.pill').forEach(v=>v.classList.remove('active'));p.classList.add('active')}));function showModal(title){document.getElementById('modal-title').textContent=title;document.getElementById('modal').classList.add('open')}draw();
</script></body></html>
